<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ChatMate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 400px;
            padding: 40px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }

        .login-header h1 {
            color: #333;
            font-size: 24px;
        }

        .admin-badge {
            background: #f44336;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #ffebee;
            color: #f44336;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="mate.png" alt="ChatMate">
            <h1>Admin Login</h1>
            <span class="admin-badge">🔒 Admin Access Only</span>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="adminLoginForm">
            <div class="input-group">
                <label>📧 Email</label>
                <input type="email" id="email" required placeholder="admin@example.com">
            </div>
            <div class="input-group">
                <label>🔒 Password</label>
                <input type="password" id="password" required placeholder="Password">
            </div>
            <button type="submit" class="login-btn">Login as Admin</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>
    
    <script>
        const auth = firebase.auth();
        
        async function checkAdminStatus(user) {
            try {
                const idTokenResult = await user.getIdTokenResult();
                return idTokenResult.claims.admin === true;
            } catch (error) {
                console.error('Error checking admin status:', error);
                return false;
            }
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.querySelector('.login-btn');
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Authenticating...';
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                const isAdmin = await checkAdminStatus(user);
                
                if (isAdmin) {
                    localStorage.setItem('isAdmin', 'true');
                    localStorage.setItem('adminEmail', email);
                    window.location.href = 'admin-panel.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = '❌ Access Denied: You do not have admin privileges.';
                    await auth.signOut();
                }
            } catch (error) {
                errorDiv.style.display = 'block';
                if (error.code === 'auth/user-not-found') {
                    errorDiv.textContent = '❌ Admin account not found.';
                } else if (error.code === 'auth/wrong-password') {
                    errorDiv.textContent = '❌ Incorrect password.';
                } else {
                    errorDiv.textContent = '❌ Login failed: ' + error.message;
                }
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login as Admin';
            }
        });
    </script>
</body>
</html>
