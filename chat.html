<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatMate Direct</title>
    <link rel="icon" type="image/png" href="mate.png">
    <link rel="apple-touch-icon" href="mate.png">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <main class="app-shell">
        <aside id="sidebar" class="sidebar">
            <div class="brand-row">
                <div class="brand-mark">
                    <img src="mate.png" alt="ChatMate">
                </div>
                <div>
                    <strong>ChatMate</strong>
                    <span>Direct</span>
                </div>
            </div>

            <!-- Active User Profile -->
            <div id="activeUserProfile" class="active-user-section"></div>

            <!-- Profile Panel (Hidden by default) -->
            <div class="profile-panel" id="profilePanel" style="display: none;">
                <label class="profile-photo-control" for="profilePhoto">
                    <img id="profilePreview" class="avatar large" src="" alt="Profile photo">
                    <span>Edit</span>
                </label>
                <div class="profile-fields">
                    <input type="text" id="profileName" placeholder="Your name">
                    <input type="text" id="profileStatus" placeholder="Status">
                </div>
                <input type="file" id="profilePhoto" accept="image/*" onchange="previewProfilePhoto(this.files[0])">
                <div id="profileUploadStatus" class="profile-upload-status"></div>
                <button class="primary-btn" onclick="saveProfile()">💾 Save profile</button>
                <button class="secondary-btn" onclick="shareProfile()">📤 Share My Profile</button>
            </div>

            <!-- Navigation Menu -->
            <div class="sidebar-nav">
                <a href="chat.html" class="sidebar-nav-item active">
                    <span>💬</span>
                    <span>Messages</span>
                </a>
                <a href="discover.html" class="sidebar-nav-item">
                    <span>🌍</span>
                    <span>Discover</span>
                </a>
                <a href="friends.html" class="sidebar-nav-item">
                    <span>👥</span>
                    <span>Friends</span>
                </a>
                <a href="devices.html" class="sidebar-nav-item">
                    <span>📱</span>
                    <span>Devices</span>
                </a>
            </div>

            <!-- Search -->
            <div class="sidebar-search">
                <input type="search" id="userSearch" placeholder="Search friends..." oninput="filterUsers()">
            </div>

            <div class="section-heading">
                <h3>Messages</h3>
            </div>
            
            <!-- Friends List with Request Badge -->
            <div style="position: relative; margin: 0 16px 8px;">
                <div id="user-list" class="list-stack"></div>
            </div>

            <!-- Logout Button -->
            <button id="logoutBtn" class="logout-btn" onclick="logout()">🚪 Log out</button>
        </aside>

        <section class="chat-container">
            <header class="chat-header">
                <div class="chat-person">
                    <img id="activeChatPhoto" class="avatar" src="" alt="">
                    <div>
                        <strong id="activeChatName">Choose someone to chat</strong>
                        <span id="activeChatStatus">Select a person from Messages.</span>
                        <span id="friendStatusBadge" class="friend-badge" style="display: none;">👥 Friend</span>
                    </div>
                </div>
                <div class="call-actions">
                    <button onclick="startCall('audio')">📞 Audio</button>
                    <button onclick="startCall('video')">📹 Video</button>
                </div>
            </header>

            <div id="chat-box" class="chat-box">
                <div class="empty-chat">
                    <img src="mate.png" alt="">
                    <strong>Your messages</strong>
                    <span>Select a user to start chatting</span>
                </div>
            </div>

            <div class="encryption-status" id="encryptionStatus">
                🔒 End-to-End Encrypted
            </div>

            <div id="typingIndicator" class="typing-indicator"></div>

            <footer class="input-area">
                <button class="media-btn" onclick="toggleMediaPicker()">+</button>
                <input type="text" id="message" placeholder="Message..." oninput="typing()" onkeydown="handleMessageKey(event)" autocomplete="off">
                <button class="send-btn" onclick="sendMessage()">Send</button>
                <input type="file" id="mediaFile" accept="image/*" hidden>
            </footer>

            <div id="mediaPicker" class="media-picker" hidden>
                <div class="media-options">
                    <button onclick="pickMediaType('image')">📷 Photo</button>
                    <button onclick="closePicker()">❌ Close</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="encryption.js"></script>
    <script src="chat.js"></script>
    <script src="auth.js"></script>
</body>
</html>
