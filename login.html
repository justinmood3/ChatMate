<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatMate - Login</title>
    <link rel="icon" type="image/png" href="mate.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-shell {
            max-width: 450px;
            width: 90%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .auth-visual {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            color: white;
            text-align: center;
        }

        .auth-visual h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .login-box {
            padding: 40px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: #ffebee;
            color: #f44336;
        }

        .message.success {
            background: #e8f5e9;
            color: #4CAF50;
        }

        .message.info {
            background: #e3f2fd;
            color: #2196F3;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
            color: #999;
        }

        a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-link {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-visual">
            <h1>Welcome Back</h1>
            <p>Sign in to continue</p>
        </div>

        <div class="login-box">
            <div id="message" class="message"></div>
            
            <input type="email" id="email" placeholder="Email" autocomplete="email">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button onclick="login(event)">Login</button>
            
            <div class="forgot-link">
                <a onclick="resetPassword()">Forgot password?</a>
            </div>

            <div class="divider"><span>or</span></div>

            <button onclick="googleLogin(event)">Continue with Google</button>

            <div style="text-align: center; margin-top: 20px;">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

</body>
