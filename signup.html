<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ChatMate</title>
        <link rel="icon" type="image/png" href="mate.png">
        <link rel="apple-touch-icon" href="mate.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="auth-page">

<div class="auth-shell">
<div class="auth-visual">
    <div class="brand-mark"><img src="mate.png" alt="ChatMate icon"></div>
    <h1>ChatMate</h1>
    <p>Create your profile and start messaging in real time.</p>
</div>

<div class="login-box">

    <h2>ChatMate</h2>
    <p class="auth-subtitle">Create your account to get started.</p>

    <input type="text" id="username" placeholder="Username">

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="signup()">Sign Up</button>

    <div class="auth-divider">or</div>

    <input type="tel" id="phone" placeholder="Phone number, e.g. +15551234567">

    <div id="recaptcha-container"></div>
    <div id="phone-status" class="phone-status"></div>

    <button onclick="sendPhoneCode()">Send SMS Code</button>

    <div id="phone-code-area" hidden>
        <input type="text" id="verificationCode" placeholder="Verification code">
        <button onclick="verifyPhoneCode()">Verify Phone</button>
    </div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="firebase-config.js"></script>

<script src="auth.js"></script>

    </body>
</html>
