<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatMate</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-shell">

<div class="auth-visual">
    <h1>ChatMate</h1>
    <p>Create your account</p>
</div>

<div class="login-box">

    <input type="text" id="username" placeholder="Username">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <input type="text" id="emailVerificationCode" placeholder="Email code">

    <button onclick="verifyEmailCode()">Verify Email</button>
    <button onclick="resendVerification()">Resend Code</button>
    <button onclick="signup()">Sign Up</button>

    <hr>

    <input type="tel" id="phone" placeholder="+250...">

    <div id="recaptcha-container"></div>

    <input type="text" id="phoneVerificationCode" placeholder="SMS code">

    <button onclick="sendPhoneCode()">Send SMS</button>
    <button onclick="verifyPhoneCode()">Verify Phone</button>

</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- config FIRST -->
<script src="firebase-config.js"></script>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  emailjs.init("3zyRvrvsaJx48Ig9w");
</script>

<!-- auth LAST -->
<script src="auth.js"></script>
</body>
</html>
